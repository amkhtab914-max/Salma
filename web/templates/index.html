<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khtab Pro Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">توصيات خطاب</div>
        <nav class="sidebar-nav">
            <a href="/" class="active">Dashboard</a>
            <a href="/recommendations">التوصيات</a>
            <a href="#">Articles</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1>Dashboard</h1>
            <div id="last-updated" class="status-footer">Last updated: Never</div>
        </header>

        <div class="dashboard">
            <div class="tradingview-card card">
                <!-- TradingView Widget Container -->
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                  <div id="tradingview_f1337" style="height:100%;width:100%"></div>
                </div>
            </div>

            <div class="signal-card card">
                <h2>Signal</h2>
                <div id="signal-content" class="placeholder"><p>Loading...</p></div>

                <h2 style="margin-top: 30px;">Confidence</h2>
                <div id="confidence-content" class="placeholder"><p>Loading...</p></div>
            </div>

            <div class="breakdown-card card">
                <h2>Strategy Breakdown</h2>
                <div id="breakdown-content" class="placeholder"><p>Loading...</p></div>
            </div>
        </div>
    </main>

    <!-- External Scripts -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="/js/chart-loader.js" defer></script>
    <script src="/js/script.js" defer></script>
</body>
</html>
