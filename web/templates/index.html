<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khtab Pro Dashboard</title>
    <style>
        :root {
            --bg-dark: #131722;
            --bg-light: #1e222d;
            --border-color: #2a2e39;
            --text-primary: #d1d4dc;
            --text-secondary: #868993;
            --accent-blue: #2962ff;
            --buy-color: #26a69a;
            --sell-color: #ef5350;
            --hold-color: #787b86;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            font-size: 14px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background-color: var(--bg-light);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
        }
        .sidebar-nav a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .sidebar-nav a.active, .sidebar-nav a:hover {
            background-color: var(--accent-blue);
            color: white;
        }
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .main-header h1 { margin: 0; font-size: 2em; }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 450px auto;
            gap: 20px;
        }
        .card {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .tradingview-card { grid-column: 1 / 2; grid-row: 1 / 3; min-height: 600px; padding: 5px; }
        .signal-card { grid-column: 2 / 3; grid-row: 1 / 2; }
        .breakdown-card { grid-column: 2 / 3; grid-row: 2 / 3; overflow-y: auto; }

        .signal-card h2 { font-size: 1.2em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 20px; }
        .signal-card .decision {
            font-size: 3.5em;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .decision.buy { color: white; background-color: var(--buy-color); }
        .decision.sell { color: white; background-color: var(--sell-color); }
        .decision.hold { color: white; background-color: var(--hold-color); }

        .confidence-meter { text-align: center; }
        .confidence-meter .score { font-size: 2.5em; font-weight: bold; }
        .confidence-meter .scenario { font-size: 0.9em; color: var(--text-secondary); margin-top: 5px; }

        .breakdown-card h2 { font-size: 1.2em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 15px; }
        .breakdown-card ul { list-style: none; padding: 0; margin: 0; }
        .breakdown-card li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
        }
        .breakdown-card li:last-child { border-bottom: none; }
        .breakdown-card .rationale { font-style: italic; color: var(--text-secondary); font-size: 0.9em; }

        .status-footer { text-align: right; font-size: 0.8em; color: var(--text-secondary); margin-top: 15px; }
        .placeholder { text-align: center; padding: 20px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">Tawsiat Khtab</div>
        <nav class="sidebar-nav">
            <a href="#" class="active">Dashboard</a>
            <a href="#">News Analysis</a>
            <a href="#">Articles</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1>Dashboard</h1>
            <div id="last-updated" class="status-footer">Last updated: Never</div>
        </header>

        <div class="dashboard">
            <div class="tradingview-card">
                <!-- TradingView Widget -->
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                  <div id="tradingview_f1337" style="height:100%;width:100%"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                  <script>
                  new TradingView.widget({ "autosize": true, "symbol": "FX:EURUSD", "interval": "60", "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "en", "toolbar_bg": "#f1f3f6", "enable_publishing": false, "allow_symbol_change": true, "container_id": "tradingview_f1337" });
                  </script>
                </div>
            </div>

            <div class="signal-card">
                <h2>Signal</h2>
                <div id="signal-content" class="placeholder"><p>Loading...</p></div>

                <h2 style="margin-top: 30px;">Confidence</h2>
                <div id="confidence-content" class="placeholder"><p>Loading...</p></div>
            </div>

            <div class="breakdown-card card">
                <h2>Strategy Breakdown</h2>
                <div id="breakdown-content" class="placeholder"><p>Loading...</p></div>
            </div>
        </div>
    </main>

    <script>
        function updateUI(data) {
            const signalContent = document.getElementById('signal-content');
            const confidenceContent = document.getElementById('confidence-content');
            const breakdownContent = document.getElementById('breakdown-content');

            if (!data || data.status) {
                const message = data ? data.status : 'Failed to load recommendation.';
                signalContent.innerHTML = `<div class="placeholder"><p>${message}</p></div>`;
                confidenceContent.innerHTML = `<div class="placeholder"><p>${message}</p></div>`;
                breakdownContent.innerHTML = `<div class="placeholder"><p>${message}</p></div>`;
                return;
            }

            // Update Signal
            const decision = data.decision || 'HOLD';
            const decisionClass = decision.toLowerCase();
            signalContent.innerHTML = `<div class="decision ${decisionClass}">${decision}</div>`;

            // Update Confidence
            const confidence = data.confidence || 0;
            const scenario = data.scenario || 'No scenario available.';
            confidenceContent.innerHTML = `
                <div class="confidence-meter">
                    <div class="score">${confidence.toFixed(1)}%</div>
                    <p class="scenario">${scenario}</p>
                </div>`;

            // Update Strategy Breakdown
            let scoresHtml = '<ul>';
            if (data.individual_scores) {
                for (const [name, result] of Object.entries(data.individual_scores)) {
                    scoresHtml += `
                        <li>
                            <div>
                                <strong>${name}</strong>
                                <div class="rationale">${result.rationale}</div>
                            </div>
                            <strong>${(result.score * 100).toFixed(0)}</strong>
                        </li>`;
                }
            }
            scoresHtml += '</ul>';
            breakdownContent.innerHTML = scoresHtml;

            document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        async function fetchRecommendation() {
            try {
                const response = await fetch('/api/latest_recommendation');
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('Failed to fetch recommendation:', error);
                updateUI({ status: 'Connection error' });
                document.getElementById('last-updated').textContent = `Last updated: Error`;
            }
        }

        fetchRecommendation();
        setInterval(fetchRecommendation, 15000);
    </script>
</body>
</html>
