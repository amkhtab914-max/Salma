<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khtab Recommendation Dashboard</title>
    <style>
        :root {
            --bg-color: #131722;
            --cell-bg-color: #1e222d;
            --border-color: #2a2e39;
            --text-color: #d1d4dc;
            --text-secondary-color: #787b86;
            --buy-color: #26a69a;
            --sell-color: #ef5350;
            --hold-color: #787b86;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-size: 14px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "header header"
                "chart recommendation";
            height: 100vh;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }
        .grid-header { grid-area: header; }
        .grid-chart { grid-area: chart; min-height: 400px;}
        .grid-recommendation { grid-area: recommendation; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background-color: var(--cell-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }
        h1, h2, h3 { margin-top: 0; }
        h1 { font-size: 1.8em; }
        h2 { font-size: 1.4em; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }

        #main-signal .decision {
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            padding: 25px;
            border-radius: 6px;
        }
        .decision.buy { color: white; background-color: var(--buy-color); }
        .decision.sell { color: white; background-color: var(--sell-color); }
        .decision.hold { color: white; background-color: var(--hold-color); }

        #confidence-score .score {
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
        }
        #confidence-score .scenario {
            text-align: center;
            font-size: 0.9em;
            color: var(--text-secondary-color);
            margin-top: 10px;
        }

        #strategy-breakdown { flex-grow: 1; overflow-y: auto; }
        #strategy-breakdown ul { list-style: none; padding: 0; margin: 0; }
        #strategy-breakdown li {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
        }
        #strategy-breakdown li:last-child { border-bottom: none; }
        #strategy-breakdown .rationale { font-style: italic; color: var(--text-secondary-color); font-size: 0.9em; }

        .status-footer {
            text-align: right;
            font-size: 0.8em;
            color: var(--text-secondary-color);
            padding-top: 10px;
        }
        .placeholder { text-align: center; padding: 40px; color: var(--text-secondary-color); }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        <header class="grid-header card">
            <h1>Tawsiat Khtab (توصية خطاب) - Recommendation Dashboard</h1>
        </header>

        <main class="grid-chart card" id="tradingview-widget">
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container" style="height:100%;width:100%">
              <div id="tradingview_f1337" style="height:100%;width:100%"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
              <script type="text/javascript">
              new TradingView.widget({
                  "autosize": true,
                  "symbol": "FX:EURUSD",
                  "interval": "60",
                  "timezone": "Etc/UTC",
                  "theme": "dark",
                  "style": "1",
                  "locale": "en",
                  "enable_publishing": false,
                  "allow_symbol_change": true,
                  "container_id": "tradingview_f1337"
              });
              </script>
            </div>
            <!-- TradingView Widget END -->
        </main>

        <aside class="grid-recommendation">
            <div id="main-signal" class="card">
                <h2>Signal</h2>
                <div id="signal-content" class="placeholder"><p>Loading...</p></div>
            </div>
            <div id="confidence-score" class="card">
                <h2>Confidence</h2>
                <div id="confidence-content" class="placeholder"><p>Loading...</p></div>
            </div>
            <div id="strategy-breakdown" class="card">
                <h2>Strategy Breakdown</h2>
                <div id="breakdown-content" class="placeholder"><p>Loading...</p></div>
            </div>
             <div class="status-footer">
                <span id="last-updated">Last updated: Never</span>
            </div>
        </aside>
    </div>

    <script>
        function updateSignal(data) {
            const content = document.getElementById('signal-content');
            const decision = data.decision || 'HOLD';
            const decisionClass = decision.toLowerCase();
            content.innerHTML = `<div class="decision ${decisionClass}">${decision}</div>`;
        }

        function updateConfidence(data) {
            const content = document.getElementById('confidence-content');
            const confidence = data.confidence || 0;
            const scenario = data.scenario || 'No scenario available.';
            content.innerHTML = `<div class="score">${confidence.toFixed(1)}%</div><p class="scenario">${scenario}</p>`;
        }

        function updateBreakdown(data) {
            const content = document.getElementById('breakdown-content');
            let scoresHtml = '<ul>';
            if (data.individual_scores) {
                for (const [name, result] of Object.entries(data.individual_scores)) {
                    scoresHtml += `
                        <li>
                            <div>
                                <strong>${name}</strong>
                                <div class="rationale">${result.rationale}</div>
                            </div>
                            <strong>${(result.score * 100).toFixed(0)}</strong>
                        </li>`;
                }
            }
            scoresHtml += '</ul>';
            content.innerHTML = scoresHtml;
        }

        function setPlaceholders(message) {
            document.getElementById('signal-content').innerHTML = `<div class="placeholder"><p>${message}</p></div>`;
            document.getElementById('confidence-content').innerHTML = `<div class="placeholder"><p>${message}</p></div>`;
            document.getElementById('breakdown-content').innerHTML = `<div class="placeholder"><p>${message}</p></div>`;
        }

        async function fetchRecommendation() {
            try {
                const response = await fetch('/api/latest_recommendation');
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                const data = await response.json();

                if (data.status) {
                     setPlaceholders(data.status);
                } else {
                    updateSignal(data);
                    updateConfidence(data);
                    updateBreakdown(data);
                    document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
                }

            } catch (error) {
                console.error('Failed to fetch recommendation:', error);
                setPlaceholders('Connection error');
                document.getElementById('last-updated').textContent = `Last updated: Error`;
            }
        }

        fetchRecommendation();
        setInterval(fetchRecommendation, 15000);
    </script>

</body>
</html>
